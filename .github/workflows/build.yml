name: Build LSPosed APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (manual)
        run: |
          # 创建 SDK 目录
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk

          # 下载 Android 命令行工具
          curl -fL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest

          # 设置环境变量
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses and install SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Xposed API
        run: |
          mkdir -p app/libs
          curl -fL -o app/libs/api-82.jar \
            https://api.xposed.info/de/robv/android/xposed/api/82/api-82.jar
          ls -la app/libs/api-82.jar

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5

      - name: Build with Gradle
        run: gradle assembleRelease --no-daemon

      - name: Verify APK
        run: |
          echo "=== 构建产物 ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -la {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: lsposed-apk
          path: app/build/outputs/apk/release/*.apk
